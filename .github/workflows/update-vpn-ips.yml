name: Update VPN feeds

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        shell: bash {0}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq whois bgpq4 jq python3-pip
          pip install --quiet --break-system-packages netaddr

      - name: Build IP feed
        shell: bash {0}
        run: |
          set -uo pipefail

          # Relay ASNs to BLOCK (Datacamp/CDN77 - the relays Proton actually used)
          : > /tmp/block_raw.txt
          for asn in AS60068 AS212238; do
            curl -s "https://stat.ripe.net/data/announced-prefixes/data.json?resource=$asn&sourceapp=monglish-feed" \
              | jq -r '.data.prefixes[].prefix' 2>/dev/null | grep -v ':' >> /tmp/block_raw.txt || true
            bgpq4 -4 -A -l x "$asn" 2>/dev/null | grep -oE '[0-9.]+/[0-9]+' >> /tmp/block_raw.txt || true
          done

          # Legit CDNs to WHITELIST (exclude from block feed)
          # AS200325 = BunnyCDN
          : > /tmp/allow.txt
          for asn in AS200325; do
            curl -s "https://stat.ripe.net/data/announced-prefixes/data.json?resource=$asn&sourceapp=monglish-feed" \
              | jq -r '.data.prefixes[].prefix' 2>/dev/null | grep -v ':' >> /tmp/allow.txt || true
          done

          # CIDR-aware subtraction
          python3 subtract.py

          echo "IP feed: $(wc -l < proton_ips.txt) entries"
          if [ "$(wc -l < proton_ips.txt)" -lt 3000 ]; then
            echo "Feed too small - aborting"
            exit 1
          fi

      - name: Commit if changed
        shell: bash {0}
        run: |
          git config user.name "feed-bot"
          git config user.email "actions@github.com"
          git add proton_ips.txt
          git diff --staged --quiet || git commit -m "auto-update VPN IPs $(date -u +%F)"
          git push
