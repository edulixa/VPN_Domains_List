name: Update VPN IP feed

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build feed
        shell: bash {0}
        run: |
          set -uo pipefail
          OUT=proton_ips.txt
          TMP=$(mktemp)

          echo "=== Proton logicals ==="
          curl -s "https://api.protonvpn.ch/vpn/logicals" \
            | jq -r '.LogicalServers[].Servers[] | .EntryIP, .ExitIP' 2>/dev/null \
            | grep -Eo '^[0-9.]+$' > /tmp/p.txt
          echo "Proton IPs: $(wc -l < /tmp/p.txt)"
          cat /tmp/p.txt >> "$TMP"

          for asn in AS60068 AS9009 AS20473; do
            echo "=== $asn ==="
            code=$(curl -s -o /tmp/r.json -w '%{http_code}' \
              "https://stat.ripe.net/data/announced-prefixes/data.json?resource=$asn&sourceapp=monglish-feed")
            echo "HTTP $code, bytes $(wc -c < /tmp/r.json)"
            head -c 150 /tmp/r.json; echo ""
            n=$(jq -r '.data.prefixes[].prefix' /tmp/r.json 2>/dev/null | grep -v ':' | tee -a "$TMP" | wc -l)
            echo "$asn IPv4 prefixes: $n"
          done

          sort -u "$TMP" | grep -vE '^[[:space:]]*$' > "$OUT"
          echo "=== TOTAL: $(wc -l < "$OUT") ==="

      - name: Commit if changed
        run: |
          git config user.name "feed-bot"
          git config user.email "actions@github.com"
          git add proton_ips.txt
          git diff --staged --quiet || git commit -m "auto-update Proton/relay IPs $(date -u +%F)"
          git push
